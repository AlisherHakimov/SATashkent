<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Adaptive icon foreground layer.
    Android only ever shows the centre ~66% circle reliably.
    All key content sits within the 300–724 band (x/y).
    Background color is set to #C42847 in pubspec.yaml.
  -->
  <defs>
    <radialGradient id="topGlow" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FF6080" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#C42847" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background fill (matches adaptive_icon_background in pubspec) -->
  <rect width="1024" height="1024" fill="#C42847"/>
  <rect width="1024" height="1024" fill="url(#topGlow)"/>

  <!-- Decorative concentric rings — scaled to safe zone -->
  <circle cx="512" cy="480" r="350" fill="none" stroke="white" stroke-width="8"  opacity="0.08"/>
  <circle cx="512" cy="480" r="270" fill="none" stroke="white" stroke-width="8"  opacity="0.11"/>
  <circle cx="512" cy="480" r="192" fill="none" stroke="white" stroke-width="8"  opacity="0.15"/>

  <!-- Centre glow disc -->
  <circle cx="512" cy="480" r="165" fill="url(#centreGlow)"/>

  <!-- "SAT" bold text — safe zone centred -->
  <text
    x="512" y="570"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="260"
    fill="white"
    text-anchor="middle"
    letter-spacing="-6">SAT</text>

  <!-- Thin divider -->
  <rect x="368" y="612" width="288" height="5" rx="2.5" fill="white" opacity="0.35"/>

  <!-- "TASHKENT" subtitle -->
  <text
    x="512" y="692"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="600"
    font-size="68"
    fill="white"
    opacity="0.65"
    text-anchor="middle"
    letter-spacing="12">TASHKENT</text>

  <!-- Bullseye dot -->
  <circle cx="512" cy="480" r="16" fill="white" opacity="0.50"/>
  <circle cx="512" cy="480" r="7"  fill="white" opacity="0.90"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Main background gradient: vibrant crimson → deep crimson -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D93055"/>
      <stop offset="55%" stop-color="#C42847"/>
      <stop offset="100%" stop-color="#7A1528"/>
    </linearGradient>

    <!-- Subtle top-left glow -->
    <radialGradient id="topGlow" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FF6080" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C42847" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner white circle fill for the centre target -->
    <radialGradient id="centreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Background rounded square ───────────────────────────────── -->
  <rect width="1024" height="1024" rx="215" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="215" fill="url(#topGlow)"/>

  <!-- ── Decorative concentric rings (subtle target / bullseye) ──── -->
  <circle cx="512" cy="472" r="390" fill="none" stroke="white" stroke-width="9"  opacity="0.08"/>
  <circle cx="512" cy="472" r="310" fill="none" stroke="white" stroke-width="9"  opacity="0.10"/>
  <circle cx="512" cy="472" r="228" fill="none" stroke="white" stroke-width="9"  opacity="0.13"/>

  <!-- Centre glow disc -->
  <circle cx="512" cy="472" r="195" fill="url(#centreGlow)"/>

  <!-- ── "SAT" bold main text ─────────────────────────────────────── -->
  <text
    x="512" y="570"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="290"
    fill="white"
    text-anchor="middle"
    letter-spacing="-8">SAT</text>

  <!-- ── Thin divider line ────────────────────────────────────────── -->
  <rect x="348" y="614" width="328" height="5" rx="2.5" fill="white" opacity="0.35"/>

  <!-- ── "TASHKENT" small subtitle ───────────────────────────────── -->
  <text
    x="512" y="700"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="600"
    font-size="76"
    fill="white"
    opacity="0.70"
    text-anchor="middle"
    letter-spacing="14">TASHKENT</text>

  <!-- ── "1600" target score badge (bottom-right accent) ─────────── -->
  <rect x="688" y="786" width="228" height="76" rx="38" fill="white" opacity="0.14"/>
  <text
    x="802" y="840"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="52"
    fill="white"
    opacity="0.85"
    text-anchor="middle"
    letter-spacing="2">1600</text>

  <!-- ── Small star dot at top-right of centre (bullseye hit mark) ── -->
  <circle cx="512" cy="472" r="18" fill="white" opacity="0.55"/>
  <circle cx="512" cy="472" r="9"  fill="white" opacity="0.90"/>
</svg>
